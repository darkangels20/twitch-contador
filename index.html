<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Marcador Twitch</title>
<style>
body {
  margin: 0;
  background: transparent;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  color: white;
  font-family: Arial, sans-serif;
}

.container {
  width: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 200px; /* distancia entre equipos */
  text-align: center;
}

.team {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.name {
  font-size: 48px;
  font-weight: bold;
  margin-bottom: 10px;
}

.score {
  font-size: 72px;
  font-weight: bold;
}

/* 🔥 VS ANIMADO 🔥 */
.vs {
  font-size: 64px;
  font-weight: 900;
  color: #ff3b3b;
  animation: vsPulse 1.5s infinite ease-in-out;
  text-shadow: 0 0 15px rgba(255, 59, 59, 0.8);
}

/* Animación */
@keyframes vsPulse {
  0% {
    transform: scale(1);
    opacity: 0.8;
  }
  50% {
    transform: scale(1.15);
    opacity: 1;
  }
  100% {
    transform: scale(1);
    opacity: 0.8;
  }
}

</style>
</head>
<body>

  <div class="container">

    <div class="team">
      <div class="name">TEAM AERODACTYL</div>
      <div class="score" id="a">0</div>
    </div>
    <div class="vs">VS</div>
    <div class="team">
      <div class="name">TEAM ARCHEOPS</div>
      <div class="score" id="b">0</div>
    </div>

  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBLGXAammzcMVx9FT0cQxgLMFoAZp6R0LI",
  authDomain: "contador-twitch.firebaseapp.com",
  databaseURL: "https://contador-twitch-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "contador-twitch",
  storageBucket: "contador-twitch.firebasestorage.app",
  messagingSenderId: "174460937156",
  appId: "1:174460937156:web:c2c8c2bac2abd703d37a91"
};

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    onValue(ref(db, "equipoA"), snap => {
      document.getElementById("a").textContent = snap.val() ?? 0;
    });

    onValue(ref(db, "equipoB"), snap => {
      document.getElementById("b").textContent = snap.val() ?? 0;
    });
  </script>

</body>
</html>
