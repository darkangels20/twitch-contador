<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Marcador Twitch</title>

  <style>
    body {
      margin: 0;
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: white;
      font-family: Arial, sans-serif;
    }

    .container {
      width: 100%;
      display: flex;
      justify-content: space-between;
      padding: 0 150px;
      text-align: center;
    }

    .team {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 40px;
      border-radius: 16px;
      min-width: 320px;
      box-shadow: 0 0 20px rgba(0,0,0,0.4);
    }

    /* TEAM AERODACTYL */
    .aero {
      background: linear-gradient(135deg, #6a1b9a, #4a148c);
    }

    /* TEAM ARCHEOPS */
    .arch {
      background: linear-gradient(135deg, #1b5e20, #2e7d32);
    }

    .name {
      font-size: 42px;
      font-weight: bold;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }

    .score {
      font-size: 72px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="team aero">
      <div class="name">TEAM AERODACTYL</div>
      <div class="score" id="scoreA">0</div>
    </div>

    <div class="team arch">
      <div class="name">TEAM ARCHEOPS</div>
      <div class="score" id="scoreB">0</div>
    </div>

  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBLGXAammzcMVx9FT0cQxgLMFoAZp6R0LI",
      authDomain: "contador-twitch.firebaseapp.com",
      databaseURL: "https://contador-twitch-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "contador-twitch",
      storageBucket: "contador-twitch.firebasestorage.app",
      messagingSenderId: "174460937156",
      appId: "1:174460937156:web:c2c8c2bac2abd703d37a91"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    onValue(ref(db, "equipoA"), snap => {
      document.getElementById("scoreA").textContent = snap.val() ?? 0;
    });

    onValue(ref(db, "equipoB"), snap => {
      document.getElementById("scoreB").textContent = snap.val() ?? 0;
    });
  </script>

</body>
</html>
