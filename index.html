<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Marcador Twitch</title>
<style>
  body {
    margin: 0;
    background: transparent;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    color: white;
    font-family: Arial, sans-serif;
  }

  .container {
    width: 90%;
    display: flex;
    justify-content: space-between;
    text-align: center;
  }

  .team {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .name {
    font-size: 48px;
    font-weight: bold;
    margin-bottom: 10px;
  }

  .score {
    font-size: 72px;
    font-weight: bold;
  }
</style>
</head>
<body>

  <div class="container">

    <div class="team">
      <span class="name">TEAM AERODACTYL</span>
      <span class="score" id="a">0</span>
    </div>

    <div class="team">
      <span class="name">TEAM ARCHEOPS</span>
      <span class="score" id="b">0</span>
    </div>

  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBLGXAammzcMVx9FT0cQxgLMFoAZp6R0LI",
  authDomain: "contador-twitch.firebaseapp.com",
  databaseURL: "https://contador-twitch-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "contador-twitch",
  storageBucket: "contador-twitch.firebasestorage.app",
  messagingSenderId: "174460937156",
  appId: "1:174460937156:web:c2c8c2bac2abd703d37a91"
};

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    onValue(ref(db, "equipoA"), snap => {
      document.getElementById("a").textContent = snap.val() ?? 0;
    });

    onValue(ref(db, "equipoB"), snap => {
      document.getElementById("b").textContent = snap.val() ?? 0;
    });
  </script>

</body>
</html>
