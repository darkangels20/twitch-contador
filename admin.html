<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Panel privado</title>
</head>
<body>

  <h2>Panel de control</h2>

  <div>
    Equipo A:
    <input type="number" id="valorA" value="0">
    <button onclick="actualizarA()">Actualizar</button>
  </div>

  <br>

  <div>
    Equipo B:
    <input type="number" id="valorB" value="0">
    <button onclick="actualizarB()">Actualizar</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBLGXAammzcMVx9FT0cQxgLMFoAZp6R0LI",
  authDomain: "contador-twitch.firebaseapp.com",
  databaseURL: "https://contador-twitch-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "contador-twitch",
  storageBucket: "contador-twitch.firebasestorage.app",
  messagingSenderId: "174460937156",
  appId: "1:174460937156:web:c2c8c2bac2abd703d37a91"
};

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    window.actualizarA = () => {
      set(ref(db, "equipoA"), Number(valorA.value));
    };

    window.actualizarB = () => {
      set(ref(db, "equipoB"), Number(valorB.value));
    };
  </script>

</body>
</html>
